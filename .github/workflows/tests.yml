name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      # Each PHP version is paired with the minimum WordPress version that
      # supports it, per https://make.wordpress.org/core/handbook/references/php-compatibility-and-wordpress-versions/
      # For PHP versions where WP core's true minimum is older than 5.9, we
      # floor at 5.9 instead, since that's this plugin's own declared
      # minimum ("Requires at least" in readme.txt)
      matrix:
        include:
          - php: '7.2'
            wp: '5.9'
            mysql: '5.7'
          - php: '7.3'
            wp: '5.9'
            mysql: '5.7'
          - php: '7.4'
            wp: '5.9'
            mysql: '8.0'
          - php: '8.0'
            wp: '5.9'
            mysql: '8.0'
          - php: '8.1'
            wp: '5.9'
            mysql: '8.0'
          - php: '8.2'
            wp: '6.1'
            mysql: '8.0'
          - php: '8.3'
            wp: '6.4'
            mysql: '8.0'
          - php: '8.4'
            wp: '6.7'
            mysql: '8.0'
          - php: '8.5'
            wp: '6.9'
            mysql: '8.0'

    services:
      database:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_DATABASE: wordpress_tests
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306

    name: PHP ${{ matrix.php }} ${{ matrix.wp != '' && format( ' (WP {0}) ', matrix.wp ) || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: dependencies-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            dependencies-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Setup tests
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1 ${{ matrix.wp }} true

      - name: Execute tests
        run: composer run test
